name: macOS Build

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch: {}

jobs:
  build-macos:
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure (universal binary, Xcode generator)
        run: >
          cmake -B build -G Xcode
          -DCMAKE_OSX_ARCHITECTURES="x86_64;arm64"
          -DCMAKE_OSX_DEPLOYMENT_TARGET=10.13

      - name: Build (Release)
        run: cmake --build build --config Release

      - name: Package artefacts
        run: |
          set -euo pipefail
          cd build/ydna_stereodrive_artefacts/Release
          ls -la
          zip -r ../../../stereodrive-macos.zip VST3 AU Standalone

      - name: Upload build artefact
        uses: actions/upload-artifact@v4
        with:
          name: stereodrive-macos
          path: stereodrive-macos.zip

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: stereodrive-macos.zip
